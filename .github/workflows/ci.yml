name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin zip

      - name: Validate metadata.json
        run: python3 -m json.tool metadata.json > /dev/null

      - name: Check JavaScript syntax
        run: |
          for f in extension.js prefs.js; do
            node --check --input-type=module < "$f"
          done

      - name: Pack
        run: make pack

      - uses: actions/upload-artifact@v4
        with:
          name: onespace-extension
          path: build/*.shell-extension.zip
